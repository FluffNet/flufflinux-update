[package]
name = "flu-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "flufflinux-update-helper"
path = "src/helper.rs"

[[bin]]
name = "flufflinux-update-worker"
path = "src/worker.rs"

[[bin]]
name = "flufflinux-update-notifier"
path = "src/notifier.rs"

[dependencies]
# This manifest serves all three binaries. Some dependencies belong to only
# one binary, so a per-binary unused-crate lint is not a package-level audit.
flu-core = { path = "../flu-core" }
serde_json.workspace = true
base64.workspace = true
chrono.workspace = true
regex.workspace = true
libc.workspace = true
zbus.workspace = true
