[workspace]
members = ["rust/flu-core", "rust/flu-bridge", "rust/flu-service", "rust/flu-test-bridge"]
resolver = "3"

[workspace.package]
version = "1.5.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
cxx = "1"
cxx-qt = "=0.10.0"
cxx-qt-build = "=0.10.0"
cxx-qt-lib = { version = "=0.10.0", default-features = false }
regex = "1"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
chrono = "0.4"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
fs2 = "0.4"
notify = "8"
percent-encoding = "2"
zbus = { version = "5", default-features = false, features = ["blocking-api", "tokio"] }

[profile.release]
lto = "thin"
